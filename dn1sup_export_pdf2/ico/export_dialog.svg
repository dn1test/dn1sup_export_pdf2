<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
  </defs>
  <!-- Background Shadow -->
  <rect x="7" y="5" width="34" height="40" rx="4" fill="#1E293B" opacity="0.2"/>
  <!-- Base Document -->
  <rect x="6" y="4" width="34" height="40" rx="4" fill="url(#pageGrad)" stroke="#CFD8DC" stroke-width="1.5"/>
  <!-- PDF Header Accent -->
  <path d="M 6 8 C 6 5.79 7.79 4 10 4 L 36 4 C 38.21 4 40 5.79 40 8 L 40 16 L 6 16 Z" fill="url(#pdfGrad)"/>
  <!-- PDF text -->
  <text x="23" y="13.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PDF</text>
  <!-- Scene / Image preview box inside page -->
  <rect x="10" y="19" width="26" height="15" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Mountain / Scene glyph -->
  <path d="M 12 32 L 19 23 L 25 30 L 29 26 L 34 32 Z" fill="#64748B" opacity="0.7"/>
  <circle cx="16" cy="23" r="2" fill="#F59E0B"/>
  <!-- Bottom document lines -->
  <line x1="10" y1="38" x2="26" y2="38" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="41" x2="20" y2="41" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Badge 2026 -->
  <rect x="26" y="36" width="13" height="6.5" rx="2" fill="#0284C7"/>
  <text x="32.5" y="41.2" font-family="'Segoe UI', sans-serif" font-size="4.2" font-weight="bold" fill="#FFFFFF" text-anchor="middle">v2</text>
</svg>
